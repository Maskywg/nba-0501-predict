name: Update NBA Results

on:
  workflow_dispatch:   # 僅允許手動觸發，已停止自動更新

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python scripts/update_results.py
